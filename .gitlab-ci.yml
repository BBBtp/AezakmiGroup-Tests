stages:
  - regression

variables:
  TEST_CATEGORY:
    value: 'all'
    options:
      - 'all'
      - 'authorization'
      - 'keywords'
      - 'product'
      - 'asa'
      - 'statistics'
      - 'kpi'
      - 'employees'
      - 'push-reviews'
      - 'task-generator'
    description: 'Functional regression category; ignored when TEST_IDS or TEST_GREP is set'
  TEST_IDS:
    value: ''
    description: 'Optional TC IDs, for example 610,611 or TC-845'
  TEST_GREP:
    value: ''
    description: 'Advanced Playwright grep; ignored when TEST_IDS is set'

doqa_github_regression:
  stage: regression
  tags:
    - doqa-bridge
  timeout: 4h
  variables:
    GITHUB_REPOSITORY: BBBtp/AezakmiGroup-Tests
    GITHUB_WORKFLOW: nightly-regression.yml
    DOQA_PIPELINE_ID: '$CI_PIPELINE_ID'
    DOQA_TOKEN: '$DOQA_AUTOTEST_TOKEN'
    CI_BRANCH: '$CI_COMMIT_REF_NAME'
    BRIDGE_REPORT_PATH: allure-results.zip
    BRIDGE_RESULT_PATH: bridge-result.json
  script:
    - curl --fail --show-error --silent --location https://doqa.app/downloads/doqa-cli --output doqa-cli
    - chmod +x doqa-cli
    - ./doqa-cli watch -- node scripts/github-actions-bridge.mjs --assert-success-after-collect
  artifacts:
    when: always
    paths:
      - bridge-result.json
      - allure-results/
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"'
    - when: never
