stages:
  - regression

doqa_github_regression:
  stage: regression
  tags:
    - doqa-bridge
  timeout: 4h
  variables:
    GITHUB_REPOSITORY: BBBtp/AezakmiGroup-Tests
    GITHUB_WORKFLOW: nightly-regression.yml
    BRIDGE_REPORT_PATH: allure-results.zip
    BRIDGE_RESULT_PATH: bridge-result.json
  script:
    - node scripts/github-actions-bridge.mjs
    - curl --fail --show-error --silent --location https://doqa.app/downloads/doqa-cli --output doqa-cli
    - chmod +x doqa-cli
    - ./doqa-cli report "$DOQA_ENDPOINT/api/autotests/report" "$DOQA_SPACE_ID" "$DOQA_AUTOTEST_TOKEN" "$BRIDGE_REPORT_PATH" allure
    - node scripts/github-actions-bridge.mjs --assert-success
  artifacts:
    when: always
    paths:
      - bridge-result.json
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"'
    - when: never
