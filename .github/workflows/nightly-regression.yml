name: Nightly regression

on:
  schedule:
    # 01:00 Moscow time (UTC+3).
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      publish_to_doqa:
        description: Publish verified Allure results to DoQA
        required: false
        type: boolean
        default: false
      bridge_pipeline_id:
        description: GitLab pipeline ID supplied by the DoQA bridge
        required: false
        type: string
        default: ''
      bridge_project_id:
        description: GitLab project ID supplied by the DoQA bridge
        required: false
        type: string
        default: ''
      bridge_branch:
        description: Branch selected in DoQA
        required: false
        type: string
        default: ''
      test_grep:
        description: Optional Playwright grep; filtered runs use one self-hosted runner
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: http://127.0.0.1
      TEST_GREP: ${{ inputs.test_grep }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

      - name: Verify regression discovery
        run: npx playwright test --config=playwright.regression.config.ts --list

      - name: Verify filtered regression discovery
        if: inputs.test_grep != ''
        run: npx playwright test --config=playwright.regression.config.ts --list --grep "$TEST_GREP"

  regression-shards:
    name: Regression · shard ${{ matrix.shard }}/${{ inputs.test_grep != '' && 1 || 3 }}
    needs: static
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.test_grep != '' && '[1]' || '[1,2,3]') }}
    runs-on: [self-hosted, Linux, X64, crm, playwright]
    timeout-minutes: 90
    env:
      ALLURE_RESULTS_DIR: allure-results/shard-${{ matrix.shard }}
      REGRESSION_SHARD_TOTAL: ${{ inputs.test_grep != '' && 1 || 3 }}
      TEST_GREP: ${{ inputs.test_grep }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_USERNAME: ${{ secrets.E2E_USER_USERNAME }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run regression shard
        shell: bash
        run: |
          args=(--pass-with-no-tests)
          if [[ -n "$TEST_GREP" ]]; then
            args+=(--grep "$TEST_GREP")
          fi
          if [[ "$REGRESSION_SHARD_TOTAL" -gt 1 ]]; then
            args+=(--shard="${{ matrix.shard }}/$REGRESSION_SHARD_TOTAL")
          fi
          npm run test:regression:shard -- "${args[@]}"

      - name: Detect flaky retries and write summary
        if: always()
        run: >-
          npm run check:flaky --
          --label="Regression · shard ${{ matrix.shard }}/${{ inputs.test_grep != '' && 1 || 3 }}"

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-allure-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: allure-results/shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diagnostics-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            blob-report
            test-results
            test-results.json
          if-no-files-found: warn
          retention-days: 14

  regression-settings:
    name: Regression · shared KPI settings
    if: >-
      ${{ always() &&
          (needs['regression-shards'].result == 'success' ||
           needs['regression-shards'].result == 'failure') }}
    needs: regression-shards
    runs-on: [self-hosted, Linux, X64, crm, playwright]
    timeout-minutes: 60
    env:
      ALLURE_RESULTS_DIR: allure-results/settings
      TEST_GREP: ${{ inputs.test_grep }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_USERNAME: ${{ secrets.E2E_USER_USERNAME }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run shared-settings regression
        shell: bash
        run: |
          args=(--pass-with-no-tests)
          if [[ -n "$TEST_GREP" ]]; then
            args+=(--grep "$TEST_GREP")
          fi
          npm run test:regression:settings -- "${args[@]}"

      - name: Detect flaky retries and write summary
        if: always()
        run: npm run check:flaky -- --label="Regression · shared KPI settings"

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-allure-settings-${{ github.run_id }}
          path: allure-results/settings
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diagnostics-settings-${{ github.run_id }}
          path: |
            blob-report
            test-results
            test-results.json
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Build Allure report
    if: >-
      ${{ always() &&
          (needs['regression-shards'].result == 'success' ||
           needs['regression-shards'].result == 'failure') &&
          (needs['regression-settings'].result == 'success' ||
           needs['regression-settings'].result == 'failure') }}
    needs:
      - regression-shards
      - regression-settings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLURE_RESULTS_DIR: collected-results/allure-results
      ALLURE_REPORT_URL: ${{ vars.NETLIFY_REPORT_URL }}
      DOQA_BRIDGE_PIPELINE_ID: ${{ inputs.bridge_pipeline_id }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download raw Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: regression-allure-*-${{ github.run_id }}
          path: collected-results/allure-results
          merge-multiple: true

      - name: Add report and bridge metadata
        run: npm run allure:metadata

      - name: Generate Allure HTML report
        run: npx allure generate collected-results/allure-results --clean -o allure-report

      - name: Upload combined raw Allure results for the bridge
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_id }}
          path: collected-results
          if-no-files-found: error
          retention-days: 14

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report
          if-no-files-found: error
          retention-days: 14

      - name: Publish Allure report to Netlify
        if: vars.NETLIFY_ENABLED == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          (cd allure-report && zip -qr ../allure-report.zip .)
          deploy_response="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/zip' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            --data-binary @allure-report.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")"
          deploy_id="$(jq -er '.id' <<<"$deploy_response")"
          deploy_url="$(jq -er '.ssl_url // .url' <<<"$deploy_response")"
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "Published to [$deploy_url]($deploy_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Netlify deploy: \`$deploy_id\`" >> "$GITHUB_STEP_SUMMARY"

  bug-drafts:
    name: Prepare bug drafts
    if: >-
      ${{ always() &&
          (needs['regression-shards'].result == 'success' ||
           needs['regression-shards'].result == 'failure') &&
          (needs['regression-settings'].result == 'success' ||
           needs['regression-settings'].result == 'failure') }}
    needs:
      - regression-shards
      - regression-settings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLURE_RESULTS_DIR: collected-results/allure-results
      BUG_DRAFTS_DIR: bug-drafts
      DOQA_ENDPOINT: ${{ secrets.DOQA_ENDPOINT }}
      DOQA_SPACE_ID: ${{ secrets.DOQA_SPACE_ID }}
      DOQA_PROJECT_ID: ${{ secrets.DOQA_PROJECT_ID }}
      DOQA_TOKEN: ${{ secrets.DOQA_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download raw Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: regression-allure-*-${{ github.run_id }}
          path: collected-results/allure-results
          merge-multiple: true

      - name: Prepare read-only bug drafts
        run: npm run bug:drafts

      - name: Upload bug drafts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bug-drafts-${{ github.run_id }}
          path: bug-drafts
          if-no-files-found: warn
          retention-days: 14

  publish-doqa:
    name: Publish completed run to DoQA
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_to_doqa &&
          (needs['regression-shards'].result == 'success' ||
           needs['regression-shards'].result == 'failure') &&
          (needs['regression-settings'].result == 'success' ||
           needs['regression-settings'].result == 'failure') }}
    needs:
      - regression-shards
      - regression-settings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: doqa-production
    env:
      ALLURE_RESULTS_DIR: collected-results/allure-results
      BUG_DRAFTS_DIR: bug-drafts
      DOQA_ENDPOINT: ${{ secrets.DOQA_ENDPOINT }}
      DOQA_SPACE_ID: ${{ secrets.DOQA_SPACE_ID }}
      DOQA_PROJECT_ID: ${{ secrets.DOQA_PROJECT_ID }}
      DOQA_TOKEN: ${{ secrets.DOQA_TOKEN }}
      DOQA_AUTOTEST_TOKEN: ${{ secrets.DOQA_AUTOTEST_TOKEN }}
      DOQA_RUN_TITLE: 'Regression #${{ github.run_number }} (${{ github.sha }})'
      ALLURE_REPORT_URL: ${{ vars.NETLIFY_REPORT_URL }}
      DOQA_BRIDGE_PIPELINE_ID: ${{ inputs.bridge_pipeline_id }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download raw Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: regression-allure-*-${{ github.run_id }}
          path: collected-results/allure-results
          merge-multiple: true

      - name: Add report and bridge metadata
        run: npm run allure:metadata

      - name: Publish and verify DoQA run
        run: npm run doqa:publish

      - name: Upload run-linked bug drafts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doqa-bug-drafts-${{ github.run_id }}
          path: bug-drafts
          if-no-files-found: warn
          retention-days: 14
